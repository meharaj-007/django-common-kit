# Uploads a release to PyPI.
#
# Runs when a GitHub Release is published, or by hand with the tag as the ref.
# Authentication is PyPI trusted publishing: PyPI trusts this workflow file in
# this repository, in the `pypi` environment, so no token is stored anywhere.
#
# The build refuses to publish a ref whose tag disagrees with
# django_common_kit.__version__, since a PyPI version can never be re-uploaded.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('django_common_kit/__init__.py').read()).group(1))")
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Ref ${GITHUB_REF_NAME} (${GITHUB_REF_TYPE}) is not the tag v${version}; refusing to publish."
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-common-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
